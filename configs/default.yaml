# Frozen experiment parameters. Mirrors docs/PROTOCOL.md. Do not hard-code these elsewhere.
data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 256
  darwin_sample: 600
  sample_seed: 42
  min_mask_frac: 0.02     # pairs whose mask covers less than this are dropped before sampling (empty or broken masks)
  split: {train: 0.8, val: 0.1, test: 0.1}
  split_seed: 42
sources: [darwin, montgomery, shenzhen]
folds: [ho_darwin, ho_montgomery, ho_shenzhen]
scenarios: [S0, S1, S2, S3]
clahe_default: {clip_limit: 2.0, tile_grid: [8, 8]}
clahe_grid:
  clip_limit: [1, 2, 3, 4]
  tile_grid: [[4, 4], [8, 8], [16, 16]]
tuning: {epochs: 20, seed: 11}
train:
  seeds: [11, 22, 33]
  batch_size: 16
  max_epochs: 60
  lr: 0.001
  lr_patience: 5
  early_stop_patience: 10
  filters: [32, 64, 128, 256]
  bottleneck: 512
  augmentation: {rotation_deg: 10, scale: [0.9, 1.1], translate: 0.05}
postprocess: {threshold: 0.5, keep_components: 2, closing_kernel: 5}
metrics: {failure_dice: 0.90, failure_sensitivity: [0.85, 0.93], hd95_empty_value: 362.0}
readiness: {max_failure_rate: 0.05, max_median_dice_drop: 0.02, max_alarm_rate: 0.10, alarm_percentile: 95}
stats: {alpha: 0.05, min_effect_dice: 0.01, bootstrap: 10000, sample_size_check: 50, sample_repeats: 1000}
qc:
  dhash_max_hamming: 4           # kandidat duplikat lintas sumber (dHash 8x8)
  verify_size: 128               # verifikasi kedua: korelasi piksel pada citra 128x128
  verify_min_corr: 0.99          # duplikat sejati bila korelasi >= ini
  flagged:                       # citra yang ditandai, tidak dibuang (keputusan sementara 26-11-2026)
    darwin/00006967_fff49165-b22d-4bb4-b9d1-d5d62c52436c.annot.original: "kotak anotasi tercetak di citra, mask paru kanan ikut berbentuk kotak"

# Percobaan 2 (docs/PLAN-PERCOBAAN-2.md). Post-hoc, approved by Dylan. Does not change the 36 main runs above.
exp2:
  scenario: S0
  # which definition of "lung" each source's masks use (seen in docs/PLAN-PERCOBAAN-2.md, figure x1)
  convention: {darwin: anatomical, montgomery: visible, shenzhen: visible}
  heads: [visible, anatomical]
  arms: [E1, E2]                 # E1: convention-aware heads; E2: E1 + strong augmentation
  pick_tie: 0.002                # final arm = higher mean val Dice; if within this, take E2
  strong_aug: {rotation_deg: 15, scale: [0.85, 1.15], translate: 0.08, gamma: [0.7, 1.5], brightness: 0.1,
               contrast: [0.75, 1.25], blur_p: 0.25, blur_sigma: [0.5, 1.5], noise_p: 0.25, noise_std: 0.03}
  fewshot: {k: [5, 10, 20, 50], iters: 300, lr: 0.0001, batch_target: 8, batch_replay: 8}
  explain: {tta_shift_px: 8, tta_scales: [0.95, 1.05], uncertain_std: 0.15, ref_percentile: 95}
